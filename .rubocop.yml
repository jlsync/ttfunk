inherit_gem:
  prawn-dev: rubocop.yml

RSpec/MultipleMemoizedHelpers:
  Max: 7
  Exclude:
    - spec/ttfunk/table/os2_spec.rb

RSpec/SpecFilePathFormat:
  CustomTransform:
    TTFunk: ttfunk
  Exclude:
    - spec/ttfunk/table/cff/charstrings_index_spec.rb
    - spec/ttfunk/table/cff/name_index_spec.rb

Style/FormatStringToken:
  Exclude:
    - examples/metrics.rb

Style/Documentation:
  Exclude:
    - examples/**/*.rb
    - spec/**/*.rb

AllCops:
  TargetRubyVersion: 3.3

# Anonymous argument/block forwarding would rewrite delegating method
# signatures and detach them from their documented @param names.
Style/ArgumentsForwarding:
  Enabled: false

Naming/BlockForwarding:
  Enabled: false
